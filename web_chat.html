<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #212121;
    --surface: #2f2f2f;         /* 사용자 말풍선, 입력창 */
    --surface-hover: #3a3a3a;
    --border: #3d3d3d;
    --text: #ececec;
    --muted: #9b9b9b;
    --code-bg: #171717;
    --link: #8ab4f8;
    --ok: #7ee787;
    --warn: #f0a35e;
    --bad: #f47067;
    --draft: #e5c77a;
    --col: 768px;               /* 대화·입력창 공통 폭 */
    --gutter: max(16px, calc((100% - var(--col)) / 2));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; font-weight: 600; font-size: 16px;
  }
  .backend-status {
    margin-left: auto; padding: 4px 10px; border-radius: 999px;
    font-weight: 500; font-size: 12px; color: var(--muted); background: var(--surface);
  }
  .backend-status::before { content: "● "; }
  .backend-status.real { color: var(--ok); background: rgba(126, 231, 135, 0.1); }
  .backend-status.test { color: var(--warn); background: rgba(240, 163, 94, 0.12); }
  .backend-status.offline { color: var(--bad); background: rgba(244, 112, 103, 0.12); }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
    /* 폭 제한을 padding으로 줘서 스크롤바는 창 오른쪽 끝에 그대로 둔다. */
    padding: 24px var(--gutter) 32px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: var(--surface-hover); }
  button {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--surface); }
  button:disabled { color: var(--muted); cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .welcome { margin: auto 0; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .welcome h2 { margin: 0 0 8px; font-size: 28px; font-weight: 600; color: var(--text); }
  .welcome p { margin: 0 0 28px; }
  .examples { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .examples button { padding: 10px 16px; font-size: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { line-height: 1.7; font-size: 15px; white-space: pre-wrap; }
  .row.user .bubble {
    max-width: 70%; padding: 10px 16px; border-radius: 20px;
    background: var(--surface); line-height: 1.5;
  }
  .row.agent .bubble { width: 100%; }   /* 에이전트 답변은 말풍선 없이 본문처럼 보여준다 */
  .row.agent.rejected .bubble {
    padding: 12px 16px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted);
  }
  .md { white-space: normal; }   /* 줄바꿈은 marked(breaks)가 <br>로 바꿔주므로 pre-wrap을 끈다 */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre { margin: 0 0 12px; }
  .md ul, .md ol { padding-left: 22px; }
  .md li + li { margin-top: 4px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 8px; font-size: 16px; }
  .md code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    background: var(--surface); padding: 2px 6px; border-radius: 6px;
  }
  .md pre { background: var(--code-bg); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 0 0 12px; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md a { color: var(--link); }
  .steps, .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    font-size: 13px; color: var(--muted);
  }
  .steps summary, .prompt-box summary {
    display: inline-block; cursor: pointer; user-select: none; list-style: none;
  }
  .steps summary:hover, .prompt-box summary:hover { color: var(--text); }
  .steps summary::-webkit-details-marker, .prompt-box summary::-webkit-details-marker { display: none; }
  .steps summary::before, .prompt-box summary::before { content: "▸ "; }
  .steps[open] summary::before, .prompt-box[open] summary::before { content: "▾ "; }
  .step-list {
    display: flex; flex-direction: column; gap: 4px;
    margin: 8px 0 0 5px; padding-left: 14px; border-left: 1px solid var(--border);
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: var(--ok); }
  .prompt-box { margin-top: -12px; }
  .prompt-box pre {
    margin: 8px 0 0; padding: 12px 14px; border-radius: 12px;
    background: var(--code-bg); color: var(--text); white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    max-height: 320px; overflow-y: auto;
  }
  form { padding: 0 var(--gutter) 12px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 8px 8px 18px; border-radius: 26px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .composer:focus-within { border-color: #5a5a5a; }
  textarea {
    flex: 1; resize: none; max-height: 200px; padding: 8px 0; border: none; outline: none;
    background: transparent; color: var(--text); font: inherit; font-size: 15px; line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    flex-shrink: 0; width: 36px; height: 36px; padding: 0; border: none;
    display: grid; place-items: center; background: var(--text); color: var(--bg);
  }
  .send:hover:not(:disabled) { background: #ffffff; }
  .send:disabled { background: var(--surface-hover); color: var(--muted); }
  .hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .validation-label { font-size: 12px; color: var(--draft); margin-bottom: 8px; }
  .validation-label.passed, .validation-label.limited, .validation-label.rejected {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 600;
  }
  .validation-label.passed { color: var(--ok); background: rgba(126, 231, 135, 0.1); }
  .validation-label.limited { color: var(--warn); background: rgba(240, 163, 94, 0.12); }
  .validation-label.rejected { color: var(--bad); background: rgba(244, 112, 103, 0.12); }
  .target-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .row.error .bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 14px;
    background: rgba(244, 112, 103, 0.08); border: 1px solid rgba(244, 112, 103, 0.35); color: #f4b0aa;
  }
  .row.error button { display: block; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>운영 인시던트 대응 에이전트
    <span class="backend-status" :class="backend.state" role="status">{{ backend.text }}</span>
  </header>
  <div id="log" ref="logEl">
    <div v-if="!log.length" class="welcome">
      <h2>무엇이 문제인가요?</h2>
      <p>장애 증상을 적으면 모니터링 지표와 대응 매뉴얼을 확인해 원인과 조치를 안내합니다.</p>
      <div class="examples" aria-label="예시 질문">
        <button v-for="q in EXAMPLES" :key="q" type="button" @click="ask(q)">{{ q }}</button>
      </div>
    </div>
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble"><div v-if="item.validationLabel" class="validation-label" role="status">{{ item.validationLabel }}</div>{{ item.text }}</div>
      </div>

      <details v-else-if="item.kind === 'steps' && item.steps.length" class="steps" :open="!item.finished">
        <summary>{{ item.finished ? `진행 단계 ${item.steps.length}개` : '진행 중' }}</summary>
        <div class="step-list">
          <div v-for="(step, i) in item.steps" :key="i" class="step"
               :class="{ done: item.finished || i < item.steps.length - 1 }">{{ step }}</div>
        </div>
      </details>

      <div v-else-if="item.kind === 'agent'" class="row agent" :class="{ rejected: item.validationStatus === 'rejected' }">
        <div class="bubble"><div v-if="item.validationLabel" class="validation-label" :class="item.validationStatus" role="status">{{ item.validationLabel }}</div><div class="md" v-html="renderMarkdown(item.text)"></div>
          <div v-if="item.choices?.length" class="target-choices" aria-label="진단 대상 시스템 선택">
            <button v-for="target in item.choices" :key="target" type="button"
                    :disabled="sending" @click="chooseTarget(target)">{{ target }}</button>
            <button type="button" :disabled="sending" @click="chooseTarget('취소')">취소</button>
          </div>
        </div>
      </div>

      <div v-else-if="item.kind === 'error'" class="row error" role="alert">
        <div class="bubble">서버 연결이 끊겨 답변을 받지 못했습니다. 백엔드가 실행 중인지 확인해 주세요.
          <button type="button" :disabled="sending" @click="retry(item.retryText)">다시 시도</button>
        </div>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <div class="composer">
      <textarea
        ref="inputEl"
        v-model="input"
        rows="1"
        aria-label="장애 증상 입력"
        placeholder="장애 증상을 적어 주세요"
        @keydown.enter="onEnter"
      ></textarea>
      <button class="send" type="submit" :disabled="sending || !input.trim()"
              :aria-label="sending ? '답변 받는 중' : '보내기'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
    <p class="hint">Enter로 보내고, Shift+Enter로 줄을 바꿉니다.</p>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const { createApp, ref, reactive, nextTick, watch } = Vue;

// 답변은 "<auth-service>의 ..."처럼 꺾쇠로 이름을 감싸는 경우가 있어, 원문 HTML로 해석하면
// 모르는 태그로 취급돼 통째로 사라진다. 원문 HTML은 해석하지 않고 글자 그대로 보여준다.
const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
marked.use({ breaks: true, renderer: { html: html => escapeHtml(html) } });

// LLM 답변은 신뢰할 수 없는 입력이므로 마크다운 변환 결과를 반드시 정화한 뒤 v-html에 넣는다.
function renderMarkdown(text) {
  return DOMPurify.sanitize(marked.parse(text || ''));
}

const BACKEND_NAMES = { openai: 'OpenAI', ollama: 'Ollama(로컬)' };

// data/monitoring.json에 장애 지표가 있는 시스템으로 골라, 눌렀을 때 실제 진단 흐름이 나오게 한다.
const EXAMPLES = [
  'auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요',
  'payments-service CPU 사용률이 너무 높아요. 어떻게 조치하나요?',
  'cache-service 메모리가 계속 오르고 있어요',
];

const STEP_LABELS = {
  TargetConfirmationRequired: () => '대상 시스템 확인 필요 · 선택 후 원래 질문으로 진단을 이어갑니다',
  TargetConfirmationCancelled: () => '대상 시스템 확인 취소',
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  RunbookRetrieved: e => e.document_ids.length
      ? `관련 런북 ${e.document_ids.length}개 확인: ${e.document_ids.join(', ')}`
      : '관련 런북 근거 없음 → 추가 정보 확인 필요',
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.status === 'limited' ? '내용 검증 미완료 → 확인된 관측만 안내' : e.verdict === '합격' ? '검수 통과' : '검수 반려 → 다시 작성',
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backend = ref({ state: '', text: '서버 확인 중' });
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const inputEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    // fake 백엔드의 답도 겉보기엔 정상 답변이라, 실제 모델인지 테스트 모드인지 헤더에서 구분해 준다.
    // 모델 이름은 "openai:gpt-4o"처럼 백엔드 접두사가 붙어 오므로, 칩 앞의 백엔드명과 겹치지 않게 뗀다.
    const modelName = name => name.replace(/^[^:]+:/, '');
    fetch('/health').then(r => r.json()).then(h => {
      backend.value = h.llm_backend === 'fake'
        ? { state: 'test', text: '테스트 모드 · 가짜 응답' }
        : { state: 'real', text: `${BACKEND_NAMES[h.llm_backend] ?? h.llm_backend} · ${modelName(h.fast_llm)} / ${modelName(h.quality_llm)}` };
    }).catch(() => {
      backend.value = { state: 'offline', text: '서버 연결 안 됨' };
    });

    // 입력창은 내용만큼 늘어나되 CSS max-height에서 멈추고, 그 뒤로는 안에서 스크롤한다.
    // 타이핑뿐 아니라 보내기 후 비우기·예시 버튼 등 코드로 값이 바뀔 때도 높이를 맞춘다.
    watch(input, async () => {
      await nextTick();
      const el = inputEl.value;
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    });

    function onEnter(e) {
      // 한글 조합 중의 Enter는 글자 확정용이라 보내지 않는다.
      if (e.shiftKey || e.isComposing) return;
      e.preventDefault();
      onSubmit();
    }

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value) return;

      // 이전 확인 버튼으로 새 질문의 대상을 실수로 바꾸지 않도록 만료시킨다.
      for (const item of log.value) if (item.choices) item.choices = [];
      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다
      let choices = [];

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; stepsItem.finished = true; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'TargetConfirmationRequired') {
          choices = [...new Set([...(e.suggestions || []), ...e.choices])];
        }
        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          if (e.phase === 'draft') streamItem.validationLabel = '검증 전 초안 · 최종 답변을 기다려 주세요';
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'Validation' && streamItem) {
          streamItem.validationLabel = e.status === 'passed' ? '검증 완료'
            : e.status === 'limited' ? '검증 미완료 · 제한된 답변으로 전환' : '검증 반려 · 이 초안은 사용하지 마세요';
          streamItem.validationStatus = e.status === 'passed' || e.status === 'limited' ? e.status : 'rejected';
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          streamItem.validationLabel = e.validation_status === 'limited' ? '제한된 답변 · 원인과 조치 미확정'
            : e.validation_status === 'passed' ? '검증 완료' : '';
          streamItem.validationStatus = e.validation_status;
          streamItem.choices = choices;
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        es.close(); sending.value = false; stepsItem.finished = true;
        log.value.push({ id: nextId++, kind: 'error', retryText: text });
        scrollToBottom();
      };
    }

    function retry(text) {
      input.value = text;
      onSubmit();
    }

    function chooseTarget(target) {
      input.value = target;
      onSubmit();
    }

    function ask(text) {
      input.value = text;
      onSubmit();
    }

    return { backend, log, input, sending, logEl, inputEl, onEnter, onSubmit, chooseTarget, retry, ask, renderMarkdown, EXAMPLES };
  },
}).mount('#app');
