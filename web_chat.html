<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #212121;
    --surface: #2f2f2f;         /* 사용자 말풍선, 입력창 */
    --surface-hover: #3a3a3a;
    --agent-bubble: #282828;    /* 에이전트 답변 말풍선 */
    --border: #3d3d3d;
    --text: #ececec;
    --muted: #9b9b9b;
    --code-bg: #171717;
    --link: #8ab4f8;
    --ok: #7ee787;
    --warn: #f0a35e;
    --bad: #f47067;
    --draft: #e5c77a;
    --col: 768px;               /* 대화·입력창 공통 폭 */
    --gutter: max(16px, calc((100% - var(--col)) / 2));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app { flex: 1; min-height: 0; display: flex; }   /* 왼쪽 사이드바 | 대화 영역 */
  .main {
    flex: 1; min-width: 0; min-height: 0;   /* header/#log/form을 감싸므로,
                                               body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; font-weight: 600; font-size: 16px;
  }
  .backend-status {
    margin-left: auto; padding: 4px 10px; border-radius: 999px;
    font-weight: 500; font-size: 12px; color: var(--muted); background: var(--surface);
  }
  .backend-status::before { content: "● "; }
  .backend-status.real { color: var(--ok); background: rgba(126, 231, 135, 0.1); }
  .backend-status.test { color: var(--warn); background: rgba(240, 163, 94, 0.12); }
  .backend-status.offline { color: var(--bad); background: rgba(244, 112, 103, 0.12); }
  .new-chat { font-weight: 500; }
  .sidebar {
    width: 260px; flex-shrink: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px; padding: 12px 8px;
    background: var(--code-bg);
  }
  .sidebar .new-chat { margin-bottom: 12px; }
  .sidebar-title { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .sidebar button {
    flex-shrink: 0; border: none; border-radius: 10px; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar button.current { background: var(--surface); }
  .sidebar .empty { margin: 4px 14px; font-size: 13px; color: var(--muted); }
  .threads-toggle, .scrim { display: none; }
  /* 좁은 화면에서는 사이드바를 숨겼다가 헤더 버튼으로 왼쪽에서 꺼낸다. */
  @media (max-width: 767px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 10; width: min(280px, 85vw);
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    .sidebar.open { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, 0.5); }
    .threads-toggle { display: inline-block; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
    /* 폭 제한을 padding으로 줘서 스크롤바는 창 오른쪽 끝에 그대로 둔다. */
    padding: 24px var(--gutter) 32px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: var(--surface-hover); }
  button {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--surface); }
  button:disabled { color: var(--muted); cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .welcome { margin: auto 0; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .welcome h2 { margin: 0 0 8px; font-size: 28px; font-weight: 600; color: var(--text); }
  .welcome p { margin: 0 0 28px; }
  .examples { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .examples button { padding: 10px 16px; font-size: 14px; }
  .row { display: flex; }
  .row.user { flex-direction: column; align-items: flex-end; gap: 6px; }
  .bubble { line-height: 1.7; font-size: 15px; white-space: pre-wrap; }
  .row.user .bubble {
    max-width: 70%; padding: 10px 16px; border-radius: 20px;
    background: var(--surface); line-height: 1.5;
  }
  /* 에이전트 답변은 배경을 한 단계 어둡게 하고 테두리를 둘러 요청 말풍선과 구분한다.
     표·코드가 들어가므로 폭은 더 넓게 둔다. */
  .row.agent .bubble {
    max-width: 85%; min-width: 0; padding: 12px 16px; border-radius: 20px;
    background: var(--agent-bubble); border: 1px solid var(--border);
  }
  .row.agent .md code { background: var(--surface-hover); }   /* 말풍선 배경과 구분되게 한 단계 밝게 */
  .row.agent .md pre code { background: none; }
  .md { white-space: normal; }   /* 줄바꿈은 marked(breaks)가 <br>로 바꿔주므로 pre-wrap을 끈다 */
  /* 반려된 초안을 지운 뒤 재작성 토큰이 오기 전까지 답변 자리가 한 줄로 쪼그라들지 않게 한다. */
  .md:empty { min-height: 3.4em; }
  .md.streaming > :last-child::after {
    content: "▍"; margin-left: 2px; color: var(--muted); animation: pulse 1s steps(2) infinite;
  }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre { margin: 0 0 12px; }
  .md ul, .md ol { padding-left: 22px; }
  .md li + li { margin-top: 4px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 8px; font-size: 15px; }
  /* 긴 진단 답변을 섹션 단위로 훑어볼 수 있게 큰 제목 아래에 구분선을 둔다. */
  .md h1, .md h2, .md h3 { margin-top: 24px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .md h1 { font-size: 20px; }
  .md h2 { font-size: 18px; }
  .md h3 { font-size: 16px; }
  .md strong { color: #ffffff; font-weight: 600; }
  .md blockquote {
    margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 3px solid var(--border); color: var(--muted);
  }
  .md hr { margin: 16px 0; border: none; border-top: 1px solid var(--border); }
  .md code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    background: var(--surface); padding: 2px 6px; border-radius: 6px;
  }
  .md pre { background: var(--code-bg); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  /* 복사 버튼을 <pre> 밖에 두어, 긴 명령을 가로로 스크롤해도 버튼은 제자리에 있게 한다. */
  .code-block { position: relative; }
  .code-block .code-copy { position: absolute; top: 6px; right: 6px; background: var(--code-bg); }
  /* 열이 많은 지표 표는 화면을 넘기지 않고 표 안에서 가로로 스크롤한다. */
  .md table {
    display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 12px; font-size: 13px;
  }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--surface-hover); font-weight: 600; }
  .md a { color: var(--link); }
  .steps {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    font-size: 13px; color: var(--muted);
  }
  .steps summary {
    display: inline-block; cursor: pointer; user-select: none; list-style: none;
  }
  .steps summary:hover { color: var(--text); }
  .steps summary::-webkit-details-marker { display: none; }
  .steps summary::before { content: "▸ "; }
  .steps[open] summary::before { content: "▾ "; }
  .step-list {
    display: flex; flex-direction: column; gap: 4px;
    margin: 8px 0 0 5px; padding-left: 14px; border-left: 1px solid var(--border);
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: var(--ok); }
  /* 첫 진행 단계나 답변 토큰이 오기 전까지 요청이 처리 중임을 보여준다. */
  .thinking { flex-shrink: 0; font-size: 13px; color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) {
    .thinking, .validation-label.revising, .md.streaming > :last-child::after { animation: none; }
  }
  form { padding: 0 var(--gutter) 12px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 8px 8px 18px; border-radius: 26px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .composer:focus-within { border-color: #5a5a5a; }
  textarea {
    flex: 1; resize: none; max-height: 200px; padding: 8px 0; border: none; outline: none;
    background: transparent; color: var(--text); font: inherit; font-size: 15px; line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    flex-shrink: 0; width: 36px; height: 36px; padding: 0; border: none;
    display: grid; place-items: center; background: var(--text); color: var(--bg);
  }
  .send:hover:not(:disabled) { background: #ffffff; }
  .send:disabled { background: var(--surface-hover); color: var(--muted); }
  .hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .validation-label { font-size: 12px; color: var(--draft); margin-bottom: 8px; }
  .validation-label.revising { color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
  /* 최종 검증 결과와 복사 버튼은 본문을 읽은 뒤 보이도록 답변 아래에 모은다. */
  .answer-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .answer-meta .validation-label { margin: 0; }
  .answer-meta .copy { margin-left: auto; }
  .copy {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; font-size: 12px; color: var(--muted); border-color: transparent;
  }
  .copy:hover:not(:disabled) { color: var(--text); }
  .validation-label.passed, .validation-label.limited {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 600;
  }
  .validation-label.passed { color: var(--ok); background: rgba(126, 231, 135, 0.1); }
  .validation-label.limited { color: var(--warn); background: rgba(240, 163, 94, 0.12); }
  .target-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .row.error .bubble {
    padding: 12px 16px; border-radius: 12px; font-size: 14px;
    background: rgba(244, 112, 103, 0.08); border: 1px solid rgba(244, 112, 103, 0.35); color: #f4b0aa;
  }
  .row.error button { display: block; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <nav class="sidebar" :class="{ open: threadsOpen }" aria-label="지난 대화">
    <button type="button" class="new-chat" :disabled="sending" @click="newChat">＋ 새 대화</button>
    <div class="sidebar-title">지난 대화</div>
    <p v-if="threads === null" class="empty">목록을 불러오지 못했습니다.</p>
    <p v-else-if="!threads.length" class="empty">지난 대화가 없습니다.</p>
    <button v-for="t in threads || []" :key="t.thread_id" type="button" :disabled="sending"
            :class="{ current: isCurrent(t.thread_id) }" :title="t.title" @click="openThread(t.thread_id)">{{ t.title || '(질문 없음)' }}</button>
  </nav>
  <div v-if="threadsOpen" class="scrim" @click="threadsOpen = false"></div>
  <div class="main">
  <header>운영 인시던트 대응 에이전트
    <span class="backend-status" :class="backend.state" role="status">{{ backend.text }}</span>
    <button type="button" class="threads-toggle" :aria-expanded="threadsOpen" @click="threadsOpen = !threadsOpen">지난 대화</button>
  </header>
  <div id="log" ref="logEl">
    <div v-if="!log.length" class="welcome">
      <h2>무엇이 문제인가요?</h2>
      <p>장애 증상을 적으면 모니터링 지표와 대응 매뉴얼을 확인해 원인과 조치를 안내합니다.</p>
      <div class="examples" aria-label="예시 질문">
        <button v-for="q in EXAMPLES" :key="q" type="button" @click="ask(q)">{{ q }}</button>
      </div>
    </div>
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
        <button type="button" class="copy" aria-label="질문 복사" title="복사" @click="copyText(item)">
          <span v-if="item.copied" role="status">{{ item.copied }}</span>
          <svg v-else width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
        </button>
      </div>

      <details v-else-if="item.kind === 'steps' && item.steps.length" class="steps" :open="!item.finished">
        <summary>{{ item.finished ? `진행 단계 ${item.steps.length}개` : '진행 중' }}</summary>
        <div class="step-list">
          <div v-for="(step, i) in item.steps" :key="i" class="step"
               :class="{ done: item.finished || i < item.steps.length - 1 }">{{ step }}</div>
        </div>
      </details>
      <div v-else-if="item.kind === 'steps' && !item.finished && !item.answering" class="thinking" role="status">생각 중…</div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble"><div v-if="item.streaming && item.validationLabel" class="validation-label" :class="item.validationStatus" role="status">{{ item.validationLabel }}</div><div class="md" :class="{ streaming: item.streaming }" v-html="renderMarkdown(item.text)" @click="copyCodeBlock"></div>
          <div v-if="item.choices?.length" class="target-choices" aria-label="진단 대상 시스템 선택">
            <button v-for="target in item.choices" :key="target" type="button"
                    :disabled="sending" @click="chooseTarget(target)">{{ target }}</button>
            <button type="button" :disabled="sending" @click="chooseTarget('취소')">취소</button>
          </div>
          <div v-if="!item.streaming" class="answer-meta">
            <span v-if="item.validationLabel" class="validation-label" :class="item.validationStatus" role="status">{{ item.validationLabel }}</span>
            <button type="button" class="copy" aria-label="답변 복사" title="복사" @click="copyText(item)">
              <span v-if="item.copied" role="status">{{ item.copied }}</span>
              <svg v-else width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div v-else-if="item.kind === 'error'" class="row error" role="alert">
        <div class="bubble">서버 연결이 끊겨 답변을 받지 못했습니다. 백엔드가 실행 중인지 확인해 주세요.
          <button type="button" :disabled="sending" @click="retry(item.retryText)">다시 시도</button>
        </div>
      </div>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <div class="composer">
      <textarea
        ref="inputEl"
        v-model="input"
        rows="1"
        aria-label="장애 증상 입력"
        placeholder="장애 증상을 적어 주세요"
        @keydown.enter="onEnter"
      ></textarea>
      <button class="send" type="submit" :disabled="sending || !input.trim()"
              :aria-label="sending ? '답변 받는 중' : '보내기'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
    <p class="hint">Enter로 보내고, Shift+Enter로 줄을 바꿉니다.</p>
  </form>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const { createApp, ref, reactive, nextTick, watch } = Vue;

// 답변은 "<auth-service>의 ..."처럼 꺾쇠로 이름을 감싸는 경우가 있어, 원문 HTML로 해석하면
// 모르는 태그로 취급돼 통째로 사라진다. 원문 HTML은 해석하지 않고 글자 그대로 보여준다.
const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
marked.use({ breaks: true, renderer: { html: html => escapeHtml(html) } });

// LLM 답변은 신뢰할 수 없는 입력이므로 마크다운 변환 결과를 반드시 정화한 뒤 v-html에 넣는다.
// 코드 블록마다 복사 버튼을 단다. 정화가 끝난 뒤 고정 문자열만 덧붙이므로 답변 내용이 끼어들 수 없다.
function renderMarkdown(text) {
  return DOMPurify.sanitize(marked.parse(text || ''))
    .replace(/<pre>/g, '<div class="code-block"><button type="button" class="copy code-copy">복사</button><pre>')
    .replace(/<\/pre>/g, '</pre></div>');
}

const BACKEND_NAMES = { openai: 'OpenAI', ollama: 'Ollama(로컬)' };

// data/monitoring.json에 장애 지표가 있는 시스템으로 골라, 눌렀을 때 실제 진단 흐름이 나오게 한다.
const EXAMPLES = [
  'auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요',
  'payments-service CPU 사용률이 너무 높아요. 어떻게 조치하나요?',
  'cache-service 메모리가 계속 오르고 있어요',
];

const STEP_LABELS = {
  TargetConfirmationRequired: () => '대상 시스템 확인 필요 · 선택 후 원래 질문으로 진단을 이어갑니다',
  TargetConfirmationCancelled: () => '대상 시스템 확인 취소',
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  RunbookRetrieved: e => e.document_ids.length
      ? `관련 런북 ${e.document_ids.length}개 확인: ${e.document_ids.join(', ')}`
      : '관련 런북 근거 없음 → 추가 정보 확인 필요',
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.status === 'limited' ? '내용 검증 미완료 → 확인된 관측만 안내' : e.verdict === '합격' ? '검수 통과' : '검수 반려 → 다시 작성',
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backend = ref({ state: '', text: '서버 확인 중' });
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const inputEl = ref(null);
    // 새로고침·서버 재시작 뒤에도 같은 대화 이력을 이어 쓰도록 thread_id를 브라우저에 보관한다.
    // 저장소를 못 쓰는 환경(사생활 보호 모드 등)에서는 이번 페이지에서만 쓰는 ID로 대신한다.
    const newThread = () => 't-web-' + Math.random().toString(36).slice(2, 8);
    let thread;
    try {
      thread = localStorage.getItem('chat-thread-id') || newThread();
      localStorage.setItem('chat-thread-id', thread);
    } catch {
      thread = newThread();
    }
    let nextId = 0;

    // fake 백엔드의 답도 겉보기엔 정상 답변이라, 실제 모델인지 테스트 모드인지 헤더에서 구분해 준다.
    // 모델 이름은 "openai:gpt-4o"처럼 백엔드 접두사가 붙어 오므로, 칩 앞의 백엔드명과 겹치지 않게 뗀다.
    const modelName = name => name.replace(/^[^:]+:/, '');
    fetch('/health').then(r => r.json()).then(h => {
      backend.value = h.llm_backend === 'fake'
        ? { state: 'test', text: '테스트 모드 · 가짜 응답' }
        : { state: 'real', text: `${BACKEND_NAMES[h.llm_backend] ?? h.llm_backend} · ${modelName(h.fast_llm)} / ${modelName(h.quality_llm)}` };
    }).catch(() => {
      backend.value = { state: 'offline', text: '서버 연결 안 됨' };
    });

    // 서버에 저장된 이 thread의 이전 대화를 다시 그린다. 진행 단계·검증 표시는 저장되지 않아 말풍선만 복원된다.
    function loadHistory() {
      const historyThread = thread;
      fetch(`/history?thread_id=${encodeURIComponent(historyThread)}`).then(r => r.json()).then(h => {
        // 불러오는 사이 새 질문을 보냈거나 다른 대화로 바꿨으면 화면을 덮어쓰지 않는다
        if (log.value.length || thread !== historyThread) return;
        log.value = h.messages.map(m => ({ id: nextId++, kind: m.role === 'user' ? 'user' : 'agent', text: m.content }));
        scrollToBottom();
      }).catch(() => {});
    }
    loadHistory();

    // 새 대화로 넘어간 뒤에도 서버에 남은 지난 대화를 다시 열 수 있게 사이드바에 보여준다.
    // threadsOpen은 좁은 화면에서 사이드바를 꺼냈는지만 나타낸다.
    const threadsOpen = ref(false);
    const threads = ref([]);
    const isCurrent = id => id === thread;
    function refreshThreads() {
      fetch('/threads').then(r => r.json()).then(t => { threads.value = t.threads; })
        .catch(() => { threads.value = null; });
    }
    refreshThreads();

    function switchThread(id) {
      thread = id;
      try { localStorage.setItem('chat-thread-id', thread); } catch {}
      log.value = [];
      input.value = '';
      threadsOpen.value = false;
    }

    function openThread(id) {
      if (id === thread) { threadsOpen.value = false; return; }
      switchThread(id);
      loadHistory();
    }

    // 입력창은 내용만큼 늘어나되 CSS max-height에서 멈추고, 그 뒤로는 안에서 스크롤한다.
    // 타이핑뿐 아니라 보내기 후 비우기·예시 버튼 등 코드로 값이 바뀔 때도 높이를 맞춘다.
    watch(input, async () => {
      await nextTick();
      const el = inputEl.value;
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    });

    function onEnter(e) {
      // 한글 조합 중의 Enter는 글자 확정용이라 보내지 않는다.
      if (e.shiftKey || e.isComposing) return;
      e.preventDefault();
      onSubmit();
    }

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value) return;

      // 이전 확인 버튼으로 새 질문의 대상을 실수로 바꾸지 않도록 만료시킨다.
      for (const item of log.value) if (item.choices) item.choices = [];
      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 같은 말풍선을 비우고 다시 채운다
      let choices = [];
      // 토큰마다 마크다운 전체를 다시 그리지 않도록, 한 프레임 동안 들어온 토큰을 모아 한 번에 붙인다.
      let pendingDelta = '';
      let flushFrame = 0;
      const flushDelta = () => {
        flushFrame = 0;
        if (streamItem && pendingDelta) streamItem.text += pendingDelta;
        pendingDelta = '';
        scrollToBottom();
      };
      const dropPendingDelta = () => {
        cancelAnimationFrame(flushFrame);
        flushFrame = 0;
        pendingDelta = '';
      };

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; stepsItem.finished = true; refreshThreads(); return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'TargetConfirmationRequired') {
          choices = [...new Set([...(e.suggestions || []), ...e.choices])];
        }
        if (e.type === 'AnswerToken' || e.type === 'FinalAnswer') stepsItem.answering = true;
        if (e.type === 'AnswerToken') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '', streaming: true });
            log.value.push(streamItem);
          }
          if (streamAttempt !== e.attempt) {   // 재작성 초안은 같은 말풍선을 처음부터 다시 채운다
            dropPendingDelta();
            streamItem.text = '';
            streamAttempt = e.attempt;
          }
          if (e.phase === 'draft') {
            streamItem.validationLabel = '검증 전 초안 · 최종 답변을 기다려 주세요';
            streamItem.validationStatus = 'draft';
          }
          pendingDelta += e.delta;
          if (!flushFrame) flushFrame = requestAnimationFrame(flushDelta);
          return;
        }

        if (e.type === 'Validation' && streamItem) {
          if (e.status === 'passed' || e.status === 'limited') {
            streamItem.validationLabel = e.status === 'passed' ? '검증 완료' : '검증 미완료 · 제한된 답변으로 전환';
            streamItem.validationStatus = e.status;
          } else {
            // 반려된 초안은 사용자가 따라 하지 않도록 즉시 지우고 재작성 토큰을 기다린다.
            dropPendingDelta();
            streamItem.text = '';
            streamItem.validationLabel = '답변을 보완하는 중…';
            streamItem.validationStatus = 'revising';
          }
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          dropPendingDelta();
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          streamItem.streaming = false;
          streamItem.validationLabel = e.validation_status === 'limited' ? '제한된 답변 · 원인과 조치 미확정'
            : e.validation_status === 'passed' ? '검증 완료' : '';
          streamItem.validationStatus = e.validation_status;
          streamItem.choices = choices;
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        es.close(); sending.value = false; stepsItem.finished = true;
        dropPendingDelta();
        if (streamItem) streamItem.streaming = false;
        log.value.push({ id: nextId++, kind: 'error', retryText: text });
        scrollToBottom();
      };
    }

    function retry(text) {
      input.value = text;
      onSubmit();
    }

    // 보낸 질문은 다시 고쳐 쓸 수 있게, 답변은 조치 명령을 그대로 붙여 쓸 수 있게
    // 화면 렌더링 전의 원문(마크다운)을 복사한다.
    async function copyText(item) {
      try {
        await navigator.clipboard.writeText(item.text);
        item.copied = '복사됨';
      } catch {
        item.copied = '복사 실패';
      }
      setTimeout(() => { item.copied = ''; }, 1500);
    }

    // 코드 블록 복사 버튼은 v-html로 그려져 Vue 이벤트를 걸 수 없으므로, 답변 영역에서 클릭을 받아 처리한다.
    async function copyCodeBlock(e) {
      const btn = e.target.closest('.code-copy');
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.nextElementSibling.textContent);
        btn.textContent = '복사됨';
      } catch {
        btn.textContent = '복사 실패';
      }
      setTimeout(() => { btn.textContent = '복사'; }, 1500);
    }

    function chooseTarget(target) {
      input.value = target;
      onSubmit();
    }

    function ask(text) {
      input.value = text;
      onSubmit();
    }

    // 이전 대화는 서버에 그대로 남고, 새 thread_id로 빈 대화를 시작한다.
    function newChat() {
      switchThread(newThread());
    }

    return { backend, log, input, sending, logEl, inputEl, onEnter, onSubmit, chooseTarget, copyText, copyCodeBlock, retry, ask, newChat,
             threadsOpen, threads, isCurrent, openThread, renderMarkdown, EXAMPLES };
  },
}).mount('#app');
</script>
</body>
</html>
